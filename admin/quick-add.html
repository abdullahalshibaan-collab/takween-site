<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إضافة عمل جديد | تكوين</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0B1F33;--blue:#2563EB;--blue-light:#60A5FA;--bg:#F5F7FA;--line:#e2e8f0;--ink-soft:#4b5c6e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Alexandria',sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;padding:24px 16px 60px;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:22px;margin-bottom:6px;}
  .sub{color:var(--ink-soft);font-size:14px;margin-bottom:28px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;}
  label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;}
  input,select,textarea{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;
    font-family:inherit;font-size:14.5px;margin-bottom:16px;background:#fff;
  }
  textarea{min-height:80px;resize:vertical;}
  .row{display:flex;gap:10px;}
  .row input{flex:1;}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-weight:600;font-size:14.5px;
    padding:12px 20px;transition:.2s;
  }
  .btn-primary{background:var(--blue);color:#fff;width:100%;}
  .btn-primary:hover{background:#1d55d1;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-fetch{background:var(--navy);color:#fff;white-space:nowrap;}
  .btn-fetch:disabled{opacity:.5;}
  .status{font-size:13.5px;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:none;}
  .status.show{display:block;}
  .status.info{background:#eef4ff;color:var(--blue);}
  .status.error{background:#fdecec;color:#c0392b;}
  .status.success{background:#eafbea;color:#1a7a34;}
  .preview{display:none;gap:14px;align-items:flex-start;margin-bottom:16px;padding:14px;background:var(--bg);border-radius:10px;}
  .preview.show{display:flex;}
  .preview img{width:90px;height:70px;object-fit:cover;border-radius:6px;background:#ddd;flex:none;}
  .gate{text-align:center;padding:60px 20px;}
  .gate button{background:var(--navy);color:#fff;padding:14px 28px;}
  a.back{display:inline-block;margin-bottom:18px;color:var(--ink-soft);font-size:13.5px;}
  .loading-msg{text-align:center;color:var(--ink-soft);font-size:14px;padding:40px 20px;}
</style>
</head>
<body>
<div class="wrap">
  <a href="/work.html" class="back">← رجوع للموقع</a>
  <h1>إضافة عمل جديد لصفحة أعمالنا</h1>
  <p class="sub">الصق رابط المشروع، واضغط "جلب المعاينة" ليجيب العنوان والصورة تلقائيًا — ثم عدّل ما تحب واحفظ.</p>

  <p id="loadingMsg" class="loading-msg">جارٍ تحميل نظام الدخول...</p>

  <div id="gate" class="gate card" style="display:none;">
    <p style="margin-bottom:16px;">سجّل دخولك أولًا لإضافة عمل جديد.</p>
    <button id="loginBtn">تسجيل الدخول</button>
  </div>

  <div id="formArea" style="display:none;">
    <div class="card">
      <label>رابط المشروع</label>
      <div class="row">
        <input type="url" id="linkInput" placeholder="https://example.com">
        <button class="btn-fetch" id="fetchBtn">جلب المعاينة</button>
      </div>
      <div id="fetchStatus" class="status"></div>

      <div class="preview" id="previewBox">
        <img id="previewImg" src="" alt="">
        <div>
          <div style="font-weight:600;font-size:14px;" id="previewTitle"></div>
          <div style="font-size:12.5px;color:var(--ink-soft);" id="previewDesc"></div>
        </div>
      </div>

      <label>نوع المشروع</label>
      <select id="categorySelect">
        <option value="site">موقع تعريفي</option>
        <option value="system">نظام أو منصة إدارة</option>
        <option value="store">متجر إلكتروني</option>
        <option value="custom">مشروع مخصص</option>
      </select>

      <label>اسم المشروع</label>
      <input type="text" id="titleInput" placeholder="اسم المشروع">

      <label>وصف قصير</label>
      <textarea id="descInput" placeholder="وصف مختصر للمشروع"></textarea>

      <label>رابط الصورة (تعبّأ تلقائيًا، وتقدر تغيّرها)</label>
      <input type="url" id="imageInput" placeholder="https://...">

      <div id="saveStatus" class="status"></div>
      <button class="btn-primary" id="saveBtn">حفظ في صفحة الأعمال</button>
    </div>
  </div>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
const gate = document.getElementById('gate');
const formArea = document.getElementById('formArea');
const loginBtn = document.getElementById('loginBtn');
const loadingMsg = document.getElementById('loadingMsg');

function showStatus(el, msg, type){
  el.textContent = msg;
  el.className = 'status show ' + type;
}
function hideStatus(el){ el.className = 'status'; }

function checkAuth(){
  loadingMsg.style.display = 'none';
  const user = window.netlifyIdentity && netlifyIdentity.currentUser();
  if(user){
    gate.style.display = 'none';
    formArea.style.display = 'block';
  } else {
    gate.style.display = 'block';
    formArea.style.display = 'none';
  }
}

if(window.netlifyIdentity){
  netlifyIdentity.on('init', checkAuth);
  netlifyIdentity.on('login', checkAuth);
  netlifyIdentity.on('logout', checkAuth);
  netlifyIdentity.init();
  // ضمان ظهور الواجهة حتى لو تأخر حدث init لأي سبب
  setTimeout(checkAuth, 1500);
} else {
  loadingMsg.textContent = 'تعذر تحميل نظام الدخول. حدّث الصفحة أو تحقق من اتصالك.';
}

loginBtn.addEventListener('click', () => netlifyIdentity.open('login'));

document.getElementById('fetchBtn').addEventListener('click', async () => {
  const link = document.getElementById('linkInput').value.trim();
  const statusEl = document.getElementById('fetchStatus');
  const fetchBtn = document.getElementById('fetchBtn');
  if(!link){ showStatus(statusEl, 'أدخل رابط المشروع أولًا', 'error'); return; }

  fetchBtn.disabled = true;
  showStatus(statusEl, 'جارٍ جلب المعاينة...', 'info');

  try {
    const res = await fetch('/.netlify/functions/fetch-preview?url=' + encodeURIComponent(link));
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'تعذر الجلب');

    document.getElementById('titleInput').value = data.title || '';
    document.getElementById('descInput').value = data.description || '';
    document.getElementById('imageInput').value = data.image || '';

    const previewBox = document.getElementById('previewBox');
    if(data.image || data.title){
      previewBox.classList.add('show');
      document.getElementById('previewImg').src = data.image || '';
      document.getElementById('previewTitle').textContent = data.title || '(بدون عنوان)';
      document.getElementById('previewDesc').textContent = data.description || '';
    }
    hideStatus(statusEl);
  } catch (err) {
    showStatus(statusEl, 'تعذر جلب المعاينة تلقائيًا — تقدر تكتب البيانات يدويًا بالأسفل', 'error');
  } finally {
    fetchBtn.disabled = false;
  }
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const saveBtn = document.getElementById('saveBtn');
  const statusEl = document.getElementById('saveStatus');
  const payload = {
    category: document.getElementById('categorySelect').value,
    title: document.getElementById('titleInput').value.trim(),
    description: document.getElementById('descInput').value.trim(),
    link: document.getElementById('linkInput').value.trim(),
    image: document.getElementById('imageInput').value.trim(),
  };
  if(!payload.title || !payload.link){
    showStatus(statusEl, 'اسم المشروع والرابط مطلوبان', 'error');
    return;
  }

  const user = netlifyIdentity.currentUser();
  if(!user){ showStatus(statusEl, 'يجب تسجيل الدخول أولًا', 'error'); return; }

  saveBtn.disabled = true;
  showStatus(statusEl, 'جارٍ الحفظ...', 'info');

  try {
    const token = await user.jwt();
    const res = await fetch('/.netlify/functions/save-project', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'فشل الحفظ');

    showStatus(statusEl, 'تم الحفظ بنجاح ✓ — يظهر بالموقع خلال دقيقة (وقت إعادة النشر التلقائي)', 'success');
    document.getElementById('linkInput').value = '';
    document.getElementById('titleInput').value = '';
    document.getElementById('descInput').value = '';
    document.getElementById('imageInput').value = '';
    document.getElementById('previewBox').classList.remove('show');
  } catch (err) {
    showStatus(statusEl, 'خطأ: ' + err.message, 'error');
  } finally {
    saveBtn.disabled = false;
  }
});
</script>
</body>
</html>
